[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "black-flow-reward-collector"
version = "0.2.0"
description = "Read-only post-battle reward collector for Arknights Integrated Strategies."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "Pillow>=10",
  "rapidocr-onnxruntime>=1.4.4",
  "MaaFw==5.12.2",
]

[project.scripts]
blackflow-reward-collector = "blackflow_rewards.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
